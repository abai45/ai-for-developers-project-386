# Окружение разработки проекта «Календарь звонков»
# Версии инструментов и команды фиксируются здесь — локально и в CI.

[settings]
experimental = true

[tools]
java = "temurin-21"
node = "22"

[tasks.setup]
description = "Установить зависимости проекта"
run = [
  "cd backend && ./mvnw -B -q dependency:go-offline",
  "cd frontend && npm install",
  "cd docs/spec/tsp && npm install",
  "cd e2e && npm install && npx playwright install chromium",
]

[tasks.spec]
description = "Сгенерировать контракт: TypeSpec → OpenAPI → TS-типы (порядок фиксирован)"
run = [
  "cd docs/spec/tsp && npm run generate",
  "cd docs/spec/tsp && npm run generate:types",
]

[tasks.spec-check]
description = "Дрейф-чек: перегенерация и сверка закоммиченных OpenAPI и TS-типов"
run = [
  "mise run spec",
  "test -z \"$(git status --porcelain -- docs/openapi.json frontend/src/lib/api/schema.d.ts)\"",
]

[tasks.e2e]
description = "Браузерные E2E-сценарии (Playwright) против настоящего сервера"
run = "cd e2e && npm run test"

[tasks.check]
description = "Все проверки: дрейф-чек контракта, тесты, линт, типы, сборка, браузерный E2E (то же выполняет CI)"
run = [
  "mise run spec-check",
  "cd backend && ./mvnw -B verify",
  "cd frontend && npm run lint",
  "cd frontend && npm run test",
  "cd frontend && npm run build",
  "mise run e2e",
]

[tasks.backend-test]
description = "Тесты бекенда (JUnit 5)"
run = "cd backend && ./mvnw -B test"

[tasks.frontend-test]
description = "Тесты фронтенда (Vitest)"
run = "cd frontend && npm run test"

[tasks.backend]
description = "Запустить бекенд (foreground, :8080)"
run = "cd backend && ./mvnw spring-boot:run"

[tasks.frontend]
description = "Запустить фронтенд (foreground, :5173)"
run = "cd frontend && npm run dev"

[daemons.backend]
run = "cd backend && ./mvnw spring-boot:run"
port = 8080

[daemons.frontend]
run = "cd frontend && npm run dev"
port = 5173
